<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="fiberGlass" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0067B5"/>
      <stop offset="50%" stop-color="#00A8E0"/>
      <stop offset="100%" stop-color="#0067B5"/>
    </linearGradient>
    <linearGradient id="coreLight" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer cable jacket -->
  <path d="M8 32c0-13.255 10.745-24 24-24s24 10.745 24 24-10.745 24-24 24S8 45.255 8 32" 
        stroke="url(#fiberGlass)" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Inner buffer tubes -->
  <path d="M8 32c0-13.255 10.745-24 24-24s24 10.745 24 24-10.745 24-24 24S8 45.255 8 32" 
        stroke="#083050" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Core fibers with light pulses -->
  <g filter="url(#glow)">
    <path d="M14 32c0-8.837 7.163-16 16-16s16 7.163 16 16-7.163 16-16 16S14 40.837 14 32" 
          stroke="url(#coreLight)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M18 32c0-6.627 5.373-12 12-12s12 5.373 12 12-5.373 12-12 12S18 38.627 18 32" 
          stroke="url(#coreLight)" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="80;0" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M22 32c0-4.418 3.582-8 8-8s8 3.582 8 8-3.582 8-8 8S22 36.418 22 32" 
          stroke="url(#coreLight)" stroke-width="0.75" fill="none" stroke-linecap="round" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="50;0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Light pulse indicators -->
  <g fill="#FFFFFF" filter="url(#glow)">
    <circle cx="32" cy="14" r="2.5" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="46" cy="18" r="2" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="32" r="1.5" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="46" cy="46" r="2" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="32" cy="50" r="2.5" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="18" cy="46" r="2" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="14" cy="32" r="1.5" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="18" cy="18" r="2" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Center hub indicator -->
  <circle cx="32" cy="32" r="6" fill="url(#coreLight)" stroke="#0067B5" stroke-width="1.5" opacity="0.9"/>
  <circle cx="32" cy="32" r="3" fill="#FFFFFF" opacity="0.8"/>
</svg>