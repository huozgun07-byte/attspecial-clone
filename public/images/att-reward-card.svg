<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFBF00"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFBF00"/>
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0067B5"/>
      <stop offset="100%" style="stop-color:#004B87"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Card Background -->
  <rect x="10" y="10" width="380" height="230" rx="16" fill="url(#cardBg)" filter="url(#glow)"/>
  <rect x="10" y="10" width="380" height="230" rx="16" fill="none" stroke="url(#goldGradient)" stroke-width="2"/>
  
  <!-- Top decorative line -->
  <rect x="30" y="30" width="340" height="3" rx="1.5" fill="url(#goldGradient)" opacity="0.6"/>
  
  <!-- Visa Logo -->
  <g transform="translate(30, 50)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" letter-spacing="2">VISA</text>
    <rect x="0" y="8" width="80" height="6" fill="url(#goldGradient)"/>
    <rect x="0" y="16" width="60" height="4" fill="#1a1a2e"/>
  </g>
  
  <!-- Chip -->
  <rect x="30" y="100" width="48" height="36" rx="4" fill="#C0C0C0" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="38" y="108" width="32" height="20" rx="2" fill="#1a1a2e"/>
  <rect x="42" y="112" width="8" height="12" rx="1" fill="#FFD700"/>
  <rect x="54" y="112" width="8" height="12" rx="1" fill="#FFD700"/>
  <rect x="66" y="112" width="8" height="12" rx="1" fill="#FFD700"/>
  
  <!-- Card Number -->
  <text x="30" y="170" font-family="monospace" font-size="24" fill="white" letter-spacing="3">250  REWARD</text>
  
  <!-- AT&T Logo -->
  <g transform="translate(260, 50)">
    <circle cx="0" cy="0" r="20" fill="url(#blueGradient)"/>
    <path d="M-10 0c0-5.5 4.5-10 10-10s10 4.5 10 10-4.5 10-10 10S-10 5.5-10 0" fill="none" stroke="white" stroke-width="2"/>
    <path d="M0 -20L0 20" stroke="white" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="10" ry="4" fill="none" stroke="white" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Bottom text -->
  <text x="30" y="210" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.7)">AT&T Visa® Reward Card</text>
  
  <!-- Gold accent circles -->
  <circle cx="370" cy="40" r="8" fill="url(#goldGradient)" opacity="0.3"/>
  <circle cx="380" cy="220" r="12" fill="url(#goldGradient)" opacity="0.2"/>
  <circle cx="20" cy="230" r="6" fill="url(#goldGradient)" opacity="0.3"/>
</svg>