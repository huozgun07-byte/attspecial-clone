<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 175" width="280" height="175" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="280" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#0D0D1A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFBF00"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFBF00"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0067B5"/>
      <stop offset="100%" stop-color="#004B87"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="7" y="7" width="266" height="161" rx="12" fill="url(#cardBg)" filter="url(#glow)"/>
  <rect x="7" y="7" width="266" height="161" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  
  <!-- Visa text -->
  <text x="20" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#fff" letter-spacing="1.5">VISA</text>
  <rect x="20" y="44" width="60" height="4" rx="2" fill="url(#goldGrad)"/>
  
  <!-- Chip -->
  <rect x="20" y="70" width="34" height="26" rx="3" fill="#C0C0C0" opacity="0.8"/>
  <rect x="24" y="74" width="26" height="18" rx="2" fill="#0D0D1A"/>
  <rect x="28" y="77" width="6" height="12" rx="1" fill="#FFD700"/>
  <rect x="36" y="77" width="6" height="12" rx="1" fill="#FFD700"/>
  <rect x="44" y="77" width="6" height="12" rx="1" fill="#FFD700"/>
  
  <!-- Amount -->
  <text x="20" y="120" font-family="monospace" font-size="18" fill="#fff" letter-spacing="2">$200 REWARD</text>
  
  <!-- AT&T Globe -->
  <g transform="translate(220, 35)">
    <circle cx="0" cy="0" r="16" fill="url(#blueGrad)"/>
    <path d="M-8 0c0-4.4 3.6-8 8-8s8 3.6 8 8-3.6 8-8 8S-8 4.4-8 0" fill="none" stroke="#fff" stroke-width="1.5"/>
    <path d="M0 -16v32" stroke="#fff" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="8" ry="3" fill="none" stroke="#fff" stroke-width="0.75" opacity="0.4"/>
  </g>
  
  <!-- Bottom text -->
  <text x="20" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#fff" opacity="0.6">AT&T Visa® Reward Card</text>
</svg>