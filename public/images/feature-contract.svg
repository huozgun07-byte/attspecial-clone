<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="docBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F5FA"/>
    </linearGradient>
    <linearGradient id="docEdge" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0067B5"/>
      <stop offset="100%" stop-color="#00A8E0"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00A8E0"/>
      <stop offset="100%" stop-color="#0067B5"/>
    </linearGradient>
    <filter id="docShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0067B5" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Document shadow -->
  <rect x="12" y="16" width="40" height="40" rx="4" fill="#000000" opacity="0.05" filter="url(#docShadow)"/>
  
  <!-- Document body -->
  <rect x="12" y="12" width="40" height="40" rx="4" fill="url(#docBg)" stroke="#E8EFF5" stroke-width="1.5"/>
  
  <!-- Top accent bar -->
  <rect x="12" y="12" width="40" height="6" rx="4" fill="url(#docEdge)"/>
  <rect x="12" y="12" width="40" height="6" rx="4" fill="#FFFFFF" opacity="0.1"/>
  
  <!-- Contract text lines -->
  <g stroke="#D0D8E0" stroke-width="1.2" stroke-linecap="round">
    <line x1="20" y1="26" x2="44" y2="26"/>
    <line x1="20" y1="32" x2="44" y2="32"/>
    <line x1="20" y1="38" x2="36" y2="38"/>
  </g>
  
  <!-- Signature line -->
  <line x1="30" y1="46" x2="48" y2="46" stroke="#0067B5" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Checkmark circle -->
  <circle cx="48" cy="20" r="10" fill="url(#checkGrad)"/>
  <path d="M42 20L46 24L52 16" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="0.6s" repeatCount="1" fill="freeze"/>
    <animate attributeName="stroke-dasharray" values="0,20;20,0" dur="0.6s" repeatCount="1" fill="freeze"/>
  </path>
  
  <!-- "No" badge -->
  <rect x="8" y="8" width="18" height="18" rx="3" fill="#E84A3A" opacity="0.9"/>
  <text x="17" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">NO</text>
</svg>