<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="techSkin" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD8B8"/>
      <stop offset="100%" stop-color="#FFB888"/>
    </linearGradient>
    <linearGradient id="uniform" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0067B5"/>
      <stop offset="100%" stop-color="#004B87"/>
    </linearGradient>
    <linearGradient id="hubBody" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#0D0D1A"/>
    </linearGradient>
    <linearGradient id="hubAccent" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00A8E0"/>
      <stop offset="100%" stop-color="#0067B5"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- All-Fi Hub (router) -->
  <g transform="translate(38, 20)" filter="url(#softShadow)">
    <!-- Hub body -->
    <rect x="0" y="0" width="22" height="18" rx="3" fill="url(#hubBody)"/>
    <rect x="0" y="0" width="22" height="18" rx="3" fill="none" stroke="#2A2A4A" stroke-width="1"/>
    
    <!-- Top accent line -->
    <rect x="2" y="2" width="18" height="3" rx="1.5" fill="url(#hubAccent)"/>
    
    <!-- LED indicators -->
    <g>
      <circle cx="5" cy="10" r="2.5" fill="#0D0D1A" stroke="#2A2A4A" stroke-width="0.5"/>
      <circle cx="5" cy="10" r="1.2" fill="#00A8E0">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="11" cy="10" r="2.5" fill="#0D0D1A" stroke="#2A2A4A" stroke-width="0.5"/>
      <circle cx="11" cy="10" r="1.2" fill="#00A8E0">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
      </circle>
      <circle cx="17" cy="10" r="2.5" fill="#0D0D1A" stroke="#2A2A4A" stroke-width="0.5"/>
      <circle cx="17" cy="10" r="1.2" fill="#00A8E0">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" begin="0.4s"/>
      </circle>
    </g>
    
    <!-- Port indicators -->
    <g stroke="#2A2A4A" stroke-width="1" stroke-linecap="round">
      <line x1="3" y1="17" x2="3" y2="19"/>
      <line x1="7" y1="17" x2="7" y2="19"/>
      <line x1="11" y1="17" x2="11" y2="19"/>
      <line x1="15" y1="17" x2="15" y2="19"/>
      <line x1="19" y1="17" x2="19" y2="19"/>
    </g>
  </g>
  
  <!-- Technician -->
  <g transform="translate(8, 16)">
    <!-- Head -->
    <circle cx="12" cy="14" r="8" fill="url(#techSkin)"/>
    <!-- Hard hat -->
    <path d="M4 10h16c0 0 2 2 2 4s-2 4-2 4H4s-2-2-2-4S4 10 4 10" fill="url(#uniform)"/>
    <path d="M4 10h16" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>
    <rect x="7" y="6" width="10" height="3" rx="1" fill="#FFBF00"/>
    
    <!-- Face details -->
    <ellipse cx="10" cy="13" rx="1.5" ry="1" fill="#2A2A4A"/>
    <ellipse cx="14" cy="13" rx="1.5" ry="1" fill="#2A2A4A"/>
    <path d="M9 17Q12 19 15 17" stroke="#2A2A4A" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    
    <!-- Body/uniform -->
    <path d="M4 26L6 50L18 50L20 26" fill="url(#uniform)"/>
    <path d="M12 22L12 26" stroke="#FFFFFF" stroke-width="0.5" opacity="0.2"/>
    
    <!-- AT&T badge on chest -->
    <circle cx="12" cy="34" r="5" fill="#FFFFFF" opacity="0.15"/>
    <circle cx="12" cy="34" r="3.5" fill="url(#hubAccent)"/>
    <path d="M9 34c0-2 1.5-3.5 3-3.5s3 1.5 3 3.5-1.5 3.5-3 3.5S9 36 9 34" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.8"/>
    <path d="M12 30L12 38" stroke="#FFFFFF" stroke-width="1" opacity="0.8"/>
    
    <!-- Tool belt -->
    <rect x="6" y="44" width="12" height="3" rx="1" fill="#1A1A2E"/>
    <circle cx="10" cy="45.5" r="1.5" fill="#2A2A4A"/>
    <circle cx="14" cy="45.5" r="1.5" fill="#2A2A4A"/>
    
    <!-- Arms -->
    <path d="M4 28Q0 36 2 44" stroke="url(#techSkin)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M20 28Q24 36 22 44" stroke="url(#techSkin)" stroke-width="5" fill="none" stroke-linecap="round"/>
    
    <!-- Hands -->
    <circle cx="2" cy="44" r="3" fill="url(#techSkin)"/>
    <circle cx="22" cy="44" r="3" fill="url(#techSkin)"/>
    
    <!-- Screwdriver in hand -->
    <path d="M0 44L-4 36" stroke="#8B7355" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-6" y="34" width="4" height="8" rx="1" fill="#1A1A2E"/>
  </g>
  
  <!-- Fiber cable coming into hub -->
  <path d="M38 29Q32 32 28 40Q24 48 18 52" 
        stroke="url(#hubAccent)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="40;0" dur="2s" repeatCount="indefinite"/>
  </path>
  <circle cx="28" cy="40" r="2" fill="#00A8E0" opacity="0.6"/>
  <circle cx="22" cy="46" r="1.5" fill="#00A8E0" opacity="0.5"/>
  <circle cx="16" cy="52" r="1" fill="#00A8E0" opacity="0.4"/>
</svg>